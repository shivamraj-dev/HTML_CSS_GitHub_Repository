<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>CSS Units</title>
<style>.pixel-box{width:200px;height:40px;background:lightblue;margin:8px 0}.half-box{width:50%;height:40px;background:lightgreen;margin:8px 0}p{font-size:1.5rem}</style></head>
<body><h1>CSS Units</h1><div class="pixel-box">200px wide</div><div class="half-box">50% wide</div><p>This paragraph uses 1.5rem text.</p></body>
</html>
