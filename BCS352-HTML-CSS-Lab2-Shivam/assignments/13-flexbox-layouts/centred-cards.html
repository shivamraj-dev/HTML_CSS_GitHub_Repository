<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Centred Cards</title>
<style>.row{min-height:80vh;display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap}.card{border:1px solid #999;border-radius:10px;padding:24px;width:180px;text-align:center;background:#f3f6fa}</style></head>
<body><div class="row"><div class="card"><h3>Starter</h3><p>Price: 199</p></div><div class="card"><h3>Standard</h3><p>Price: 349</p></div><div class="card"><h3>Premium</h3><p>Price: 499</p></div></div></body>
</html>
