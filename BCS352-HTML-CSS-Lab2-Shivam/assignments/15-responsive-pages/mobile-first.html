<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mobile First Cards</title>
<style>.cards{display:grid;grid-template-columns:1fr;gap:16px}.card{padding:20px;background:#e8eef5;border:1px solid #1d3557;border-radius:10px}@media(min-width:600px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><h1>Responsive Cards</h1><div class="cards"><article class="card"><h2>Card One</h2><p>This card stacks on narrow screens.</p></article><article class="card"><h2>Card Two</h2><p>At 600px and wider, the cards sit side by side.</p></article></div></body>
</html>
