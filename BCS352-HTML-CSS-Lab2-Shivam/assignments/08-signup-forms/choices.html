<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Choices</title></head>
<body>
<h1>Choose Your Details</h1>
<form>
  <fieldset><legend>Gender</legend>
    <label><input type="radio" name="gender" value="female"> Female</label>
    <label><input type="radio" name="gender" value="male"> Male</label>
  </fieldset>
  <p><label for="course">Course:</label>
    <select id="course" name="course"><option value="BCA">BCA</option><option value="B.Tech">B.Tech</option></select>
  </p>
</form>
</body>
</html>
