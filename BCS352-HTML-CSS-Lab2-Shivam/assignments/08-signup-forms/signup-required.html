<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Required Sign Up</title></head>
<body>
<h1>Required Sign-Up Details</h1>
<form action="#" method="get">
  <p><label for="name">Full name:</label> <input id="name" name="name" type="text" placeholder="Enter your full name" required></p>
  <p><label for="required-email">Email:</label> <input id="required-email" name="email" type="email" required></p>
  <button type="submit">Submit</button>
</form>
</body>
</html>
