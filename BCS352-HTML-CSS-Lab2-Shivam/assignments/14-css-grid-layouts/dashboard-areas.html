<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Dashboard Areas</title>
<style>.dashboard{display:grid;grid-template-columns:200px 1fr;grid-template-areas:"header header" "sidebar main" "footer footer";gap:10px}.dashboard>*{padding:22px;background:#dceaf5}.header{grid-area:header}.sidebar{grid-area:sidebar}.main{grid-area:main}.footer{grid-area:footer}</style></head>
<body><div class="dashboard"><header class="header">Header</header><aside class="sidebar">Sidebar</aside><main class="main">Main area</main><footer class="footer">Footer</footer></div></body>
</html>
